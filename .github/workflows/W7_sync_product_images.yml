name: "W7 · Sync Product Images"

# Synchronise les images produit automatiquement une fois par nuit. Le code est
# orchestre par GitHub Actions, mais s'execute sur Kamatera afin que Pricez voie
# une adresse IP israelienne. Cloudinary n'est plus utilise.
# Peut aussi être déclenché manuellement avec des options de maintenance.

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      reset_all_to_null:
        description: "Remettre toute la colonne products.has_image à NULL avant le run ?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      check_spaces_first:
        description: "Scanner DigitalOcean Spaces avant les sources distantes ?"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      recheck_all:
        description: "Retraiter tous les produits, pas seulement ceux à NULL ?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      recheck_non_ean_false:
        description: "Réparer les FALSE non-EAN issus de l'ancienne règle trop stricte ?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      dry_run:
        description: "Dry-run sans écriture DB ?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      preflight_only:
        description: "Tester uniquement les sources directes + upload Space, sans toucher la DB ?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      limit:
        description: "Nombre max de produits à traiter (vide = illimité)"
        required: false
        default: ""

concurrency:
  group: sync-product-images
  cancel-in-progress: true

jobs:
  sync:
    name: "Sync products.has_image"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Configure Kamatera SSH
        env:
          KAMATERA_HOST: ${{ secrets.KAMATERA_HOST }}
          KAMATERA_SSH_KEY: ${{ secrets.KAMATERA_SSH_KEY }}
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KAMATERA_SSH_KEY" > ~/.ssh/kamatera_key
          chmod 600 ~/.ssh/kamatera_key
          ssh-keyscan -H "$KAMATERA_HOST" >> ~/.ssh/known_hosts

      - name: Build image sync arguments
        id: args
        shell: bash
        run: |
          ARGS=()
          if [ "${{ inputs.reset_all_to_null }}" = "true" ]; then
            ARGS+=(--reset-all-to-null)
          fi
          if [ "${{ inputs.check_spaces_first }}" = "false" ]; then
            ARGS+=(--skip-spaces-check)
          fi
          if [ "${{ inputs.recheck_all }}" = "true" ]; then
            ARGS+=(--recheck-all)
          fi
          if [ "${{ inputs.recheck_non_ean_false }}" = "true" ]; then
            ARGS+=(--recheck-non-ean-false)
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${{ inputs.preflight_only }}" = "true" ]; then
            ARGS+=(--preflight-only)
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            if ! [[ "${{ inputs.limit }}" =~ ^[0-9]+$ ]]; then
              echo "limit must be a positive integer"
              exit 2
            fi
            ARGS+=(--limit "${{ inputs.limit }}")
          fi
          : > /tmp/w7-args
          if ((${#ARGS[@]})); then
            printf '%q ' "${ARGS[@]}" > /tmp/w7-args
          fi

      - name: Copy image sync code to Kamatera
        env:
          KAMATERA_HOST: ${{ secrets.KAMATERA_HOST }}
          KAMATERA_USER: ${{ secrets.KAMATERA_USER }}
        run: |
          scp -i ~/.ssh/kamatera_key \
            sync_product_images.py \
            "$KAMATERA_USER@$KAMATERA_HOST:/tmp/agali-sync-product-images.py"

      - name: Sync product images from Kamatera
        env:
          KAMATERA_HOST: ${{ secrets.KAMATERA_HOST }}
          KAMATERA_USER: ${{ secrets.KAMATERA_USER }}
        shell: bash
        run: |
          ARGS=$(cat /tmp/w7-args)
          ssh -i ~/.ssh/kamatera_key "$KAMATERA_USER@$KAMATERA_HOST" \
            "sudo flock -w 300 /var/lock/agali-product-images.lock bash -lc '
              set -euo pipefail
              set -a
              source /etc/agali-scraper.env
              set +a
              systemctl is-active --quiet agali-db-tunnel.service
              export POSTGRESQL_URL=\"\${POSTGRESQL_URL:-\${DATABASE_URL:-}}\"
              export DATABASE_URL=\"\${DATABASE_URL:-\$POSTGRESQL_URL}\"
              export OPENFOODFACTS_USER_AGENT=\"Agali-image-sync/1.0 (https://agali.co.il)\"
              /opt/agali-scraper/venv/bin/python /tmp/agali-sync-product-images.py $ARGS
            '"

      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install reporting dependencies
        if: always()
        run: pip install -r requirements.txt

      - name: Open PostgreSQL SSH tunnel for report
        if: success()
        uses: ./.github/actions/open-postgres-tunnel
        with:
          ssh-host: ${{ secrets.DO_HOST }}
          ssh-user: ${{ secrets.DO_USERNAME }}
          ssh-port: ${{ secrets.DO_PORT }}
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Send Bot 1 image sync summary
        if: success()
        env:
          TELEGRAM_BOT1_TOKEN: ${{ secrets.TELEGRAM_BOT1_TOKEN }}
          TELEGRAM_BOT1_CHAT_ID: ${{ secrets.TELEGRAM_BOT1_CHAT_ID }}
          POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
        run: |
          python reports/scrape_report.py \
            --source github \
            --status success \
            --title "W7 product image sync" \
            --workflow "W7_sync_product_images.yml" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send Bot 2 image sync failure alert
        if: failure()
        env:
          TELEGRAM_BOT2_TOKEN: ${{ secrets.TELEGRAM_BOT2_TOKEN }}
          TELEGRAM_BOT2_CHAT_ID: ${{ secrets.TELEGRAM_BOT2_CHAT_ID }}
        run: |
          python telegram_notify.py --bot health --message "🚨 <b>Agali Health</b> · W7 product image sync failed\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
