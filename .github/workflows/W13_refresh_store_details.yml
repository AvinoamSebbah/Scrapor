name: "W13 · Incremental Store Details"

on:
  schedule:
    # Weekly on Sunday: refresh missing and week-old data without user traffic.
    - cron: "25 2 * * 0"

concurrency:
  group: refresh-store-details
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Open PostgreSQL SSH tunnel
        uses: ./.github/actions/open-postgres-tunnel
        with:
          ssh-host: ${{ secrets.DO_HOST }}
          ssh-user: ${{ secrets.DO_USERNAME }}
          ssh-port: ${{ secrets.DO_PORT }}
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}
      - name: Resolve numeric locality codes from the official CBS dictionary
        env:
          POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
          AGALI_LOCAL_DB_TUNNEL: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/repair_numeric_store_cities.py --apply
      - name: Refresh missing or week-old official store details
        env:
          POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
          AGALI_LOCAL_DB_TUNNEL: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/enrich_store_details.py --apply --limit 80
      - name: Refresh official whole-chain catalogs and retained snapshots
        env:
          POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
          AGALI_LOCAL_DB_TUNNEL: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/enrich_store_catalogs.py --apply
      - name: Fill remaining gaps from strictly matched OpenStreetMap POIs
        env:
          POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
          AGALI_LOCAL_DB_TUNNEL: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/enrich_store_details_osm.py --apply
      - name: Confirm remaining locations against the monthly Overture catalog
        env:
          POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
          AGALI_LOCAL_DB_TUNNEL: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/enrich_store_locations_overture.py --apply
